# Reverse-mode testbed: the *local* side has the public address. It listens
# for QUIC on 8388/udp and serves SOCKS5 on :1080. The relays forward to the
# local, and the remote (e.g. behind NAT, with good internet egress) dials back
# to the local directly and through every relay.
#
#   docker compose -f deploy/docker-compose.reverse.yml up -d --build
#   curl --socks5-hostname 127.0.0.1:1080 http://whoami/
services:
  whoami:
    image: traefik/whoami

  local:
    build: ..
    image: mpquic:latest
    command: local --reverse -s 0.0.0.0 -p 8388 -b 0.0.0.0 -l 1080 -k demo-password -u --stats 10
    ports:
      - "127.0.0.1:1080:1080"
    restart: unless-stopped

  relay-a:
    image: mpquic:latest
    command: relay --listen :9001 --target local:8388 --link delay=25ms,jitter=4ms,rate=50mbit
    depends_on: [local]
    restart: unless-stopped

  relay-b:
    image: mpquic:latest
    command: relay --listen :9002 --target local:8388 --link delay=60ms,rate=80mbit,loss=1%
    depends_on: [local]
    restart: unless-stopped

  remote:
    image: mpquic:latest
    # -s: the local's own address (direct path) plus each relay
    command: remote --reverse -s local:8388 -s relay-a:9001 -s relay-b:9002 -k demo-password -u
    depends_on: [local, relay-a, relay-b]
    restart: unless-stopped

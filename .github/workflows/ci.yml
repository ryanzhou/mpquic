name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 -timeout 10m ./...
      - name: cross-compile
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: mpquic-binaries
          path: dist/
          retention-days: 7
